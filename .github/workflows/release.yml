name: Release

on:
  push:
    tags:
      # Stable releases:      v1.2.3
      # Beta / RC prereleases: v1.2.3-beta.1, v1.2.3-rc.2, ...
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Use vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-rc.N release tags."
            exit 1
          fi

      - name: Require a prerelease before a stable release
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_tag="$(git tag --list "${GITHUB_REF_NAME}-*" --sort=-version:refname | head -n 1)"
          if [[ -z "$prerelease_tag" ]]; then
            echo "::error::Stable tag ${GITHUB_REF_NAME} requires an existing same-version prerelease tag (for example ${GITHUB_REF_NAME}-beta.1)."
            exit 1
          fi

          prerelease_commit="$(git rev-list -n 1 "$prerelease_tag")"
          if ! git merge-base --is-ancestor "$prerelease_commit" "$GITHUB_SHA"; then
            echo "::error::Stable tag ${GITHUB_REF_NAME} must descend from prerelease ${prerelease_tag}."
            exit 1
          fi

          unexpected_files="$(git diff --name-only "$prerelease_commit" "$GITHUB_SHA" | grep -Ev '^(CHANGELOG\.md|package\.json|package-lock\.json)$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "::error::Code changed after ${prerelease_tag}. Publish another beta or release candidate before stable promotion."
            echo "$unexpected_files"
            exit 1
          fi

          published_at="$(gh release view "$prerelease_tag" --json isPrerelease,publishedAt --jq 'select(.isPrerelease) | .publishedAt')"
          if [[ -z "$published_at" ]]; then
            echo "::error::Prerelease ${prerelease_tag} has not published a GitHub prerelease successfully."
            exit 1
          fi

          age_seconds="$(( $(date +%s) - $(date -d "$published_at" +%s) ))"
          if (( age_seconds < 172800 )); then
            echo "::error::Prerelease ${prerelease_tag} must soak for at least 48 hours before stable promotion."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          CURSEFORGE_ENABLED: 'true'
        run: npm run build

  # Determines which OSes the release job's matrix builds on. Platform policy:
  # stable tags (no "-") ship Windows-only — Windows is the stable update
  # channel. Prerelease tags (containing "-") ship on all three OSes — the
  # macOS/Linux public beta only ever arrives via prerelease tags. The
  # `matrix` context isn't available in job-level `if`, so this is computed
  # here as a job output and consumed via `fromJson()` in the release job's
  # matrix instead.
  plan:
    runs-on: ubuntu-latest
    outputs:
      oses: ${{ steps.set-oses.outputs.oses }}
    steps:
      - name: Determine target OSes
        id: set-oses
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo 'oses=["windows-latest","macos-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'oses=["windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [validate, plan]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.plan.outputs.oses) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CURSEFORGE_ENABLED: 'true'
        run: npx electron-vite build

      # electron-builder reads the "publish" config in package.json (GitHub
      # provider) and, with --publish always, uploads each platform's installers
      # plus the electron-updater metadata (latest.yml / latest-mac.yml /
      # latest-linux.yml) to one GitHub Release for this tag. The launcher's
      # self-updater (src/main/updater.ts) consumes that metadata.
      #
      # A tag WITHOUT a prerelease suffix (e.g. v0.4.0) publishes a normal, full
      # release and, per the `plan` job above, only ever runs on windows-latest
      # — Windows is the stable update channel. A tag WITH one (e.g.
      # v0.4.0-beta.1, v0.4.0-rc.2 — anything containing "-") publishes a
      # GitHub *prerelease* and runs on all three OSes: GitHub's "latest
      # release" API and electron-updater's stable channel both ignore it, so
      # existing users are never auto-pushed a beta — only people who
      # deliberately grab it from the Releases page get the Mac/Linux/Windows
      # public beta builds.

      - name: Package and publish (stable)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CURSEFORGE_ENABLED: 'true'
        run: npx electron-builder --publish always

      - name: Package and publish (prerelease)
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          EP_PRE_RELEASE: 'true'
          CURSEFORGE_ENABLED: 'true'
        run: npx electron-builder --publish always

      # Legacy launcher versions (<= 0.3.25) ship a hand-rolled updater that,
      # when applying an update, looks for a release asset named exactly
      # "<exe-asset-name>.sha256" and verifies the downloaded installer's
      # SHA-256 against its first whitespace-delimited token. If the asset is
      # missing they silently skip verification (console warning only), so
      # this file must keep being published even though electron-updater
      # itself doesn't need it. Do not remove it.
      - name: Publish legacy .sha256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # electron-builder's GitHub publisher replaces spaces in asset names
          # with dashes when uploading, so the checksum file (and the name
          # inside it) must match that sanitized form.
          $assetName = $exe.Name -replace ' ', '-'
          $checksumFile = Join-Path dist "$assetName.sha256"
          "$hash  $assetName" | Out-File -FilePath $checksumFile -Encoding ascii -NoNewline
          gh release upload "$env:GITHUB_REF_NAME" $checksumFile --clobber

  finalize:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish changelog release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no release notes for ${version}."
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md

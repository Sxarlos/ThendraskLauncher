name: Feature request
description: Suggest an improvement to Thendrask Launcher
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please focus on the user problem and the outcome you want.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult or impossible today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like the launcher to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.
  - type: dropdown
    id: platforms
    attributes:
      label: Relevant platforms
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Presence relay
        - All platforms
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, links, or other useful context.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find this request.
          required: true
        - label: This request is about Thendrask Launcher rather than a third-party mod or modpack.
          required: true
